<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vanguard Systems{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0d12;
            --bg-surface: #131722;
            --bg-surface-hover: #191f2e;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --ruby: #e11d48;
            --ruby-dark: #9f1239;
            --ruby-glow: rgba(225, 29, 72, 0.22);
        }

        body {
            background-color: var(--bg-dark);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 80% 0%, rgba(225, 29, 72, 0.12), transparent 40%),
                              radial-gradient(circle at 15% 20%, rgba(159, 18, 57, 0.09), transparent 35%);
        }

        .navbar {
            background-color: rgba(11, 13, 18, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-mark {
            width: 10px;
            height: 10px;
            background-color: var(--ruby);
            box-shadow: 0 0 12px var(--ruby);
            display: inline-block;
            margin-right: 10px;
            transform: rotate(45deg);
        }

        .nav-link {
            color: #9ca3af;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: #ffffff;
        }

        .nav-link.active {
            position: relative;
        }

        .nav-link.active::after {
            content: "";
            position: absolute;
            left: 0.5rem;
            right: 0.5rem;
            bottom: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--ruby), #fb7185);
            border-radius: 2px;
        }

        .ruby-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .ruby-card:hover {
            transform: translateY(-2px);
            border-color: rgba(225, 29, 72, 0.45);
            box-shadow: 0 10px 28px -10px var(--ruby-glow);
        }

        .badge-ruby {
            background-color: rgba(225, 29, 72, 0.16);
            color: #fda4af;
            border: 1px solid rgba(225, 29, 72, 0.35);
            font-weight: 500;
        }

        .btn-ruby {
            background: linear-gradient(135deg, var(--ruby), var(--ruby-dark));
            border: none;
            color: #fff;
            font-weight: 500;
            box-shadow: 0 4px 16px var(--ruby-glow);
        }

        .btn-ruby:hover {
            background: linear-gradient(135deg, #f43f5e, var(--ruby));
            color: #fff;
        }

        .btn-outline-ruby {
            border: 1px solid rgba(225, 29, 72, 0.45);
            color: #fda4af;
            background: transparent;
        }

        .btn-outline-ruby:hover {
            background-color: rgba(225, 29, 72, 0.14);
            color: #fff;
            border-color: var(--ruby);
        }

        .section-kicker {
            color: #fb7185;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-control {
            background-color: #0e1118;
            border: 1px solid var(--border-subtle);
            color: #f3f4f6;
        }

        .form-control:focus {
            background-color: #0e1118;
            color: #ffffff;
            border-color: var(--ruby);
            box-shadow: 0 0 0 0.2rem var(--ruby-glow);
        }

        footer {
            margin-top: auto;
            border-top: 1px solid var(--border-subtle);
            background-color: rgba(11, 13, 18, 0.7);
            color: #6b7280;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold text-white" href="{% url 'home' %}">
                <span class="brand-mark"></span>VANGUARD
            </a>
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'news' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'news' %}">News</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'mgmt' in request.resolver_match.url_name or 'management' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'management' %}">Management</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'about' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'about' %}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'contact' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'contacts' %}">Contacts</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-4">
        <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 small">
            <span>© 2026 Vanguard Systems. All rights reserved.</span>
            <span>Engineered for resilience & speed</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
